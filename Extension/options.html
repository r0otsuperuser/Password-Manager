<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 360px; padding: 16px; font-family: sans-serif; }
    label { display: block; margin-bottom: 6px; font-size: 14px; }
    input { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 10px; }
    button { padding: 8px 12px; cursor: pointer; background: #4C3CDE; color: white; border: none; border-radius: 4px; }
    #status { margin-top: 10px; font-size: 13px; color: green; }
  </style>
</head>
<body>
  <h3>Password Manager Settings</h3>
  <label for="token">Token generated by <code>./pwmanager init</code>:</label>
  <input id="token" type="password" placeholder="Paste the token here (64 hex characters)">
  <button id="save">Save</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
